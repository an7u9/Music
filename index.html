<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pink Beats Music Player</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="responsive.css" />
  <link rel="stylesheet" href="lrics.css" />
  <!-- Google Fonts - Modern Selection -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- PWA: enables "Add to Home Screen" installability, which is what
       gives reliable background/lock-screen audio on mobile, especially iOS -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1e1219" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pink Beats" />
</head>

<body>
  <!-- Navbar for Playlists -->
  <nav id="sidebar" class="sidebar">
    <div class="playlist-list-container">
      <ul class="playlist-list">
        <li data-playlist="indie" class="playlist-item">
          <span class="playlist-title">Indie</span>
        </li>
        <li data-playlist="international" class="playlist-item">
          <span class="playlist-title">International</span>
        </li>
        <li data-playlist="romantic" class="playlist-item">
          <span class="playlist-title">Romantic</span>
        </li>
        <li data-playlist="party" class="playlist-item">
          <span class="playlist-title">Party</span>
        </li>
        <li data-playlist="chill" class="playlist-item">
          <span class="playlist-title">Chill</span>
        </li>
        <li data-playlist="focus" class="playlist-item">
          <span class="playlist-title">Focus</span>
        </li>
      </ul>
    </div>
  </nav>

  <div class="main-wrapper">
    <!-- Main Container for Playlist Tracks -->
    <div class="main-container container">
      <ul id="playlist" class="playlist">
        <li class="track-details" data-src="songs/Zaroorat.mp3">
          <span class="track-title">Zaroorat Se Jyada</span>
          <span class="artist">Arijit Singh</span>
          <span class="track-duration">5:36</span>
        </li>
      </ul>
    </div>
  </div>

  <!-- Music Player -->
  <div class="music-player">
    <div class="player-content">
      <div class="track-image-container playing">
        <img src="https://res.cloudinary.com/dyp1fmsph/image/upload/v1785335068/image_2_vsh8e0.png" alt="Track Image" id="track-image" />
      </div>
      <div class="track-info">
        <h2 id="track-title">Pink Beat</h2>
        <h3 id="track-artist">Hybrido</h3>
      </div>
      <div class="controls-and-timer">
        <div class="buttons-container">
          <button id="shuffle-btn" class="control-btn" aria-label="Toggle shuffle" aria-pressed="false">
            <i class="fas fa-random"></i>
          </button>
          <button id="prev-btn" class="control-btn" aria-label="Previous track">
            <i class="fas fa-step-backward"></i>
          </button>
          <button id="play-pause-btn" class="control-btn" aria-label="Play" aria-pressed="false">
            <i class="fa-solid fa-play"></i>
            <i class="fa-solid fa-pause"></i>
          </button>
          <button id="next-btn" class="control-btn" aria-label="Next track">
            <i class="fas fa-step-forward"></i>
          </button>
          <button id="loop-btn" class="control-btn" aria-label="Toggle loop" aria-pressed="false">
            <i class="fas fa-redo"></i>
          </button>
        </div>
        <div class="seek-container">
          <div class="time-info">
            <span id="current-time">00:00</span>
            <input type="range" id="seek-bar" value="0" min="0" max="100" class="seek-bar" aria-label="Seek" />
            <span id="duration-time">11:11</span>
          </div>
        </div>
      </div>
      <!-- Audio Player -->
      <audio preload="none" id="audio-player" src="songs/Zaroorat.mp3"></audio>

      <!-- Volume Control -->
      <div class="volume-control">
        <i class="fas fa-volume-up volume-icon"></i>
        <input type="range" id="volume-bar" value="1" min="0" max="1" step="0.01" class="volume-bar vertical" aria-label="Volume" />
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
  <script src="lyrics.js"></script>
  <script src="https://kit.fontawesome.com/8cb620ace4.js" crossorigin="anonymous"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>

</html>
