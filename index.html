<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Music Collections</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <ul id="playlist" class="playlist">
        <li data-src="songs/Zaroorat.mp3">
          <span class="track-title">Zaroorat Se Jyada</span>
          <span class="artist">Arijit Singh</span>
          <span class="track-duration">5:36</span>
        </li>
         <li data-src="songs/veham.mp3">
          <span class="track-title">Veham</span>
          <span class="artist">Armaan Malik</span>
          <span class="track-duration">5:14</span>
        </li>
        <li data-src="songs/Barsaat.mp3">
          <span class="track-title">Barsaat</span>
          <span class="artist">Armaan Malik</span>
          <span class="track-duration">3:41</span>
        </li>
        <li data-src="songs/intezaar.mp3">
          <span class="track-title">Tera Main Intezaar</span>
          <span class="artist">Armaan Malik</span>
          <span class="track-duration">3:51</span>
        </li>
        <li data-src="songs/Baarishon.mp3">
          <span class="track-title">Baarishon Mein</span>
          <span class="artist">Darshan Raval</span>
          <span class="track-duration">3:44</span>
        </li>
        <li data-src="songs/Judaiyaan.mp3">
          <span class="track-title">Judaiyaan</span>
          <span class="artist">Darshan Raval</span>
          <span class="track-duration">3:22</span>
        </li>
        <li data-src="songs/dil.mp3">
          <span class="track-title">Dil</span>
          <span class="artist">Raghav Chaitanya</span>
          <span class="track-duration">5:09</span>
        </li>
      </ul>

      <div class="music-player">
        <div class="player-content">
          <!-- Corrected container class name -->

          <div class="track-image-container">
            <img src="pics\Zaroorat.jpg" alt="Track Image" id="track-image" />
          </div>

          <div class="controls-and-timer">
            <div class="buttons-container">
              <button id="shuffle-btn" class="control-btn">
                <i class="fas fa-random"></i>
              </button>
              <button id="prev-btn" class="control-btn">
                <i class="fas fa-step-backward"></i>
              </button>
              <button id="play-pause-btn" class="control-btn">
                <i class="fa-solid fa-play"></i>
                <i class="fa-solid fa-pause"></i>
              </button>
              <button id="next-btn" class="control-btn">
                <i class="fas fa-step-forward"></i>
              </button>
              <button id="loop-btn" class="control-btn">
                <i class="fas fa-redo"></i>
              </button>
            </div>

            <div class="seek-container">
              <div class="time-info">
                <span id="current-time">0:00</span>
                <input
                  type="range"
                  id="seek-bar"
                  value="0"
                  class="seek-bar horizontal"
                />
                <span id="duration-time">0:00</span>
              </div>
            </div>
          </div>
          <audio id="audio-player" src="songs\Zaroorat.mp3"></audio>

          <div class="volume-control">
            <input
              type="range"
              id="volume-bar"
              value="1"
              min="0"
              max="1"
              step="0.01"
              class="volume-bar vertical"
            />
          </div>

          <div class="track-info">
            <h2 id="track-title">Track Title</h2>
            <h3 id="track-artist">Artist Name</h3>
          </div>
        </div>
      </div>
    </div>

    <script src="scripts.js"></script>
    <script
      src="https://kit.fontawesome.com/8cb620ace4.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
